project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "README.md"
    - "ARCHITECTURE.md"
    # Individual projects
    - "projects/genomic-qc-pipeline.qmd"
    - "projects/ipsc-optimization.qmd"
    - "projects/immunology-development.qmd"
    - "projects/student-dropout-prediction_xgb_092525.qmd"
    - "projects/student-dropout-prediction_nn_201025.qmd"
    
    

    # Category pages
    - "projects/categories/*.qmd"
    # Exclude documentation and guides
    - "!NOTEBOOK_TO_QUARTO_*.md"
    - "!*_GUIDE.md"
    - "!SELECTION_GUIDE.md"
    - "!CSS_CLEANUP_SUMMARY.md"
    - "!FIGURE_TEMPLATES.md"
    # Exclude agent_quarto_reports directory (templates and prompts)
    - "!agent_quarto_reports/**"
    # Exclude generated prompts
    - "!agent_*.md"
    # Exclude for now
    - "!projects/work_in_progress/**"
    - "!projects/**/*.ipynb"
    - "!projects/**/before-body.tex"
    - "!projects/**/header.tex"
    - "!assets/**/*.qmd"
    - "!assets/**/*.ipynb"
    

website:
  site-url: "https://rgrandym.github.io/site"
  description: "Professional Portfolio - Principal Scientist & Group Leader"
  navbar:
    background: '#000000'
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"   
        href: projects.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    center: "© 2025 Rodrigo Grandy"

format:
  html:
    theme: 
      light: cosmo
    css: styles/styles.css
    toc: false
    link-external-newwindow: true