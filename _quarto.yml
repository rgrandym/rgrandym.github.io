project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "!projects/**/*.ipynb"
    - "!projects/**/before-body.tex"
    - "!projects/**/header.tex"
    - "!projects/course_2/**/*"
    - "!projects/course_3_p1/**/*"
    - "!projects/course_3_p2/**/*"
    - "!projects/mp_5.3/**/*"
    - "!projects/mp_6.3/**/*"
    - "!assets/**/*.qmd"
    - "!assets/**/*.ipynb"
    - "projects/genomic-qc-pipeline.qmd"
    - "projects/ipsc-optimization.qmd"
    - "projects/immunology-development.qmd"
    - "projects/student-dropout-prediction.qmd"

website:
  site-url: https://rgrandym.github.io
  description: "Professional Portfolio - Principal Scientist & Group Leader"
  navbar:
    background: '#000000'
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    center: "© 2025 Rodrigo Grandy"

format:
  html:
    theme: 
      light: cosmo
    css: styles/styles.css
    toc: false
    link-external-newwindow: true